[package]
name = "meowtify-plugin-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end tests for meowtify-plugin. Kept apart so the plugin crate's own tests do not compile Cranelift."

# Tests only: nothing here is part of the app or its normal dependency graph.
[dev-dependencies]
meowtify-plugin = { path = "../meowtify-plugin" }
# Tests compile the test guest in-process, so they need Cranelift.
wasmtime = { version = "50.0.1", default-features = false, features = ["std", "runtime", "component-model", "pooling-allocator", "cranelift"] }

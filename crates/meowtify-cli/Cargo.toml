[package]
name = "meowtify-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line tool for Meowtify: update, diagnose and repair the app when its window does not work."

[[bin]]
name = "meowtify-cli"
path = "src/main.rs"

[dependencies]
meowtify-library = { path = "../meowtify-library" }
meowtify-provider = { path = "../meowtify-provider" }
serde_json = "1"
tokio ={ version = "1", default-features = false, features = ["rt", "time", "process"] }

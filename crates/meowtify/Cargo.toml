[package]
name = "meowtify"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# The `--mock` catalogue and the window's screenshot aids; always on in debug builds.
dev = ["meowtify-ui/dev"]

[dependencies]
meowtify-autoplay = { path = "../meowtify-autoplay" }
meowtify-core = { path = "../meowtify-core" }
meowtify-discord = { path = "../meowtify-discord" }
meowtify-jam.workspace = true
meowtify-ui = { path = "../meowtify-ui" }
meowtify-library = { path = "../meowtify-library" }
meowtify-player = { path = "../meowtify-player" }
meowtify-provider = { path = "../meowtify-provider", features = ["native-extract"] }
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net"] }

[target.'cfg(windows)'.dependencies]
# The sign-in window (`--login`), a hidden mode of this program. They add no memory unless
# that mode runs: the window is its own process, about 490 MB while open, and short-lived.
wry = "0.57"
tao = "0.37"
url = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package]
name = "meowtify-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Screenshot and test aids driven by MEOWTIFY_* variables; always on in debug builds.
dev = []

[dependencies]
meowtify-autoplay = { path = "../meowtify-autoplay" }
meowtify-core = { path = "../meowtify-core" }
meowtify-jam.workspace = true
meowtify-jam-net = { path = "../meowtify-jam-net" }
meowtify-library = { path = "../meowtify-library" }
meowtify-provider = { path = "../meowtify-provider" }
meowtify-cache = { path = "../meowtify-cache" }
meowtify-ui-view = { path = "../meowtify-ui-view" }
getrandom = "0.3"
slint = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
png = { version = "0.18", default-features = false }
gif = { version = "0.14", default-features = false, features = ["std"] }

# Desktop windows use winit with OpenGL (femtovg). femtovg needs glutin, which has no iOS
# support, so iOS renders with Skia on Metal. rfd has no iOS backend either.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = "0.17"
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "unstable-winit-030"] }

# The in-app YouTube sign-in keeps its cookie file encrypted for the Windows user only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-skia"] }

[package]
name = "test-guest"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: built by the meowtify-plugin-tests integration tests for wasm32-wasip2.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.46", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

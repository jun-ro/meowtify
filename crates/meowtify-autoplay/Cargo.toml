[package]
name = "meowtify-autoplay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Keeps music playing: finds songs close to the current one, downloads them ahead of time and queues them."

[dependencies]
meowtify-core = { path = "../meowtify-core" }
meowtify-library = { path = "../meowtify-library" }
meowtify-provider = { path = "../meowtify-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

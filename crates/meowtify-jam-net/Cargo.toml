[package]
name = "meowtify-jam-net"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Jam sessions on the network: the relay connection and the direct WebRTC links between host and guests."

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"
meowtify-core = { version = "0.1.0", path = "../meowtify-core" }
meowtify-jam.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros", "net", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.21.1"

[dev-dependencies]
meowtify-jam-relay.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

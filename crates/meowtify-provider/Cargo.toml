[package]
name = "meowtify-provider"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Music providers (YouTube first) and the download queue. Downloads run through the yt-dlp executable."

[features]
# In-process YouTube, SoundCloud and Audius extraction, with no yt-dlp, curl or ffmpeg.
# iOS always uses it (see `cfg(target_os = "ios")`); the feature makes the same code
# buildable and testable on a desktop.
native-extract = []

[dependencies]
meowtify-core = { path = "../meowtify-core" }
async-trait = "0.1"
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "process", "io-util", "macros", "fs", "net"] }
# TLS for the in-process client: rustls with ring, which the iOS build already pulls in
# through webrtc. No OpenSSL and no native-tls.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs", "net"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3"] }

[[example]]
name = "native_try"
required-features = ["native-extract"]

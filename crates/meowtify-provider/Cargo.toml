[package]
name = "meowtify-provider"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Music providers (YouTube first) and the download queue. Downloads run through the yt-dlp executable."

[dependencies]
meowtify-core = { path = "../meowtify-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "process", "io-util", "macros", "fs"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs"] }

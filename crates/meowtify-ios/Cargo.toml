[package]
name = "meowtify-ios"
description = "iOS entry point. Wires the shared crates the way crates/meowtify does, without the desktop-only parts."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Pick the software renderer at run time instead of Skia (Metal). Both are compiled in.
software = []

# Everything is an iOS-only dependency, so `cargo build --workspace` on Windows stays fast.
# femtovg is left out on purpose: it needs glutin, and glutin has no iOS support.
[target.'cfg(target_os = "ios")'.dependencies]
meowtify-core = { path = "../meowtify-core" }
meowtify-library = { path = "../meowtify-library" }
meowtify-player = { path = "../meowtify-player" }
meowtify-provider = { path = "../meowtify-provider" }
meowtify-autoplay = { path = "../meowtify-autoplay" }
meowtify-ui = { path = "../meowtify-ui" }
slint = { workspace = true, features = ["backend-winit", "renderer-skia", "renderer-software"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

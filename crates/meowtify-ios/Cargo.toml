[package]
name = "meowtify-ios"
description = "iOS entry point. Phase 1 spike: proves the toolchain, the renderer and the sideload path."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Pick the software renderer at run time instead of Skia (Metal). Both are compiled in.
software = []

# Slint is pulled in on iOS only, so `cargo build --workspace` on Windows stays fast.
# femtovg is left out on purpose: it needs glutin, and glutin has no iOS support.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-software", "compat-1-2"] }

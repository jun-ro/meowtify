name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Reads the cache that CI saved on main, because a tag has none of its own. Tests already ran
      # in CI before the tag, so this job only builds.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked -p meowtify -p meowtify-cli
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/meowtify.exe dist/meowtify-windows-x64.exe
          cp target/release/meowtify-cli.exe dist/meowtify-cli-windows-x64.exe
          cd dist
          sha256sum meowtify-windows-x64.exe meowtify-cli-windows-x64.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/meowtify-windows-x64.exe dist/meowtify-cli-windows-x64.exe dist/SHA256SUMS
